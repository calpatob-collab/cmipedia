:root{--paper:#1f1f1f;--paper2:#2c2c2c;--ink:#eadfc4;--soft:#ab977c;--red:#e5233a;--gold:#dba52a;--moss:#6d9c36;--blue:#4b82c8;--plum:#a84a80;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:20px/1.65 "EB Garamond",Georgia,"Times New Roman",serif;
background-color:var(--paper);
}
.bar{display:none;margin:3rem 0 0}.editing .bar{display:block}.mb .bar,#lb .bar{display:block}.bar button{font:inherit;font-size:.95rem;font-style:italic;color:var(--red);background:none;border:0;padding:0;margin-right:1.4rem;text-decoration:underline dotted;text-underline-offset:3px}.bar button:hover{text-decoration-style:solid}
.ed-on{background:var(--paper2);outline:0;border-radius:3px;box-shadow:0 0 0 .5rem var(--paper2)}
.tg{background:none;border:0;color:var(--soft);font-size:.85rem;padding:0 .4rem;transition:transform .2s}.tg.op{transform:rotate(90deg)}
.add{display:block;background:none;border:0;font:inherit;font-size:.88em;font-style:italic;color:var(--soft);padding:.15rem 0;text-align:left}.add:hover,.tg:hover{color:var(--red)}
#md{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(10,8,12,.74);display:flex;align-items:center;justify-content:center;z-index:10000}#md[hidden]{display:none}
.mb{background:var(--paper2);padding:1.8rem 2rem;width:min(92vw,24rem);border-radius:4px}.mb #mh{margin:0 0 1rem;font-style:italic}.mb input{margin-bottom:.8rem}.mb .d{min-height:1.4em;margin:0}.mb .bar{margin:1rem 0 0}
.pf{float:right;width:11rem;margin:.4rem 0 1rem 2rem;text-align:center}
.pic{display:block;width:100%;height:auto;border-radius:3px;background:var(--paper2)}
img.pic{max-height:24rem;object-fit:contain;transition:filter .2s}img.pic:hover{filter:brightness(1.12)}img.pic.nozoom:hover{filter:none}
.cap{font-size:.88rem;line-height:1.4;font-style:italic;color:var(--soft);margin-top:.55rem;text-align:center;overflow-wrap:anywhere}.cap:empty{display:none}.cap.ed-on:empty{display:block;min-height:1.4em}.cap.ed-on:empty::before{content:attr(data-ph);opacity:.55}
.pic.none{display:flex;align-items:center;justify-content:center;aspect-ratio:4/5}.pic.none .ph{width:42%;height:42%;fill:none;stroke:var(--soft);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.pb{display:none;margin-top:.55rem}.editing .pb{display:block}.add{display:none!important}.editing .add{display:block!important}.ctl{display:none}.editing .ctl{display:block}#lr{display:none}.editing #lr{display:inline}
#mu{position:fixed;top:calc(env(safe-area-inset-top,0px) + .9rem);right:calc(1.2rem + 40px);z-index:60;background:none;border:0;padding:.35rem;color:var(--soft);line-height:0;transition:color .2s}#mu:hover{color:var(--red)}#mu svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}#mu .sl{display:none}#mu.m .sl{display:block}#mu.m .w1,#mu.m .w2{display:none}
#pn{position:fixed;top:calc(env(safe-area-inset-top,0px) + .9rem);right:1.2rem;z-index:60;background:none;border:0;padding:.35rem;color:var(--soft);line-height:0;transition:color .2s,filter .2s}#pn:hover{color:var(--red)}#pn.on{color:var(--gold);filter:drop-shadow(0 0 4px rgba(219,165,42,.6))}#pn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.lnk{font:inherit;font-size:.9rem;font-style:italic;color:var(--red);background:none;border:0;padding:0;margin:0 .5rem 0 0;text-decoration:underline dotted;text-underline-offset:3px}.lnk:hover{text-decoration-style:solid}.pb .lnk{margin:0 .45rem}
.gh{clear:both}.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.8rem;margin-bottom:1rem}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;transition:filter .2s}.gal img:hover{filter:brightness(1.2)}.gi{position:relative}.gx{display:none;position:absolute;top:.35rem;right:.35rem;width:1.7rem;height:1.7rem;padding:0;border:0;border-radius:50%;background:rgba(20,20,20,.78);color:#eadfc4;font:inherit;font-size:1.2rem;line-height:1;align-items:center;justify-content:center}.editing .gx{display:flex}.gx:hover{background:var(--red);color:#fff}
#lb{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(10,8,12,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10000}#lb[hidden]{display:none}#li{max-width:90vw;max-height:78vh;border-radius:4px}#lb .bar{margin-top:1rem}
@media(max-width:760px){.pf{width:8rem;margin-left:1.2rem}}
.nv{margin:0 0 1.4rem}.nv summary{color:var(--soft);font-style:italic;font-size:.95rem;list-style:none;padding:0}.nv summary::-webkit-details-marker{display:none}.nv summary::before{content:"\25B8  "}.nv[open] summary::before{content:"\25BE  "}.nv summary:hover{color:var(--red)}
.nv ul{list-style:none;padding:0;margin:.4rem 0 0}.nv li{font-size:.95rem;line-height:1.55}
.tb{margin:0 0 .9rem}.fm{font-style:normal;text-decoration:none!important;font-size:1.05rem;min-width:1.1rem}.tb[hidden]{display:none}.tb .lnk{margin-right:1.1rem}.tb .d{font-size:.9rem}
#mcol{display:flex;flex-wrap:wrap;gap:.55rem;margin:0 0 1rem}#mcol[hidden]{display:none}#mcol button{width:28px;height:28px;border:0;padding:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);opacity:.75;transition:transform .15s}#mcol button.on{opacity:1;transform:scale(1.28)}
nav a.link.in{padding-left:1.1rem}.add.in{padding-left:1.1rem}
.sb{display:block;width:100%;background:none;border:0;font:inherit;font-size:.92em;font-style:italic;color:var(--soft);padding:.15rem 0 .15rem .5rem;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sb:hover{color:var(--red)}
.mvs{background:transparent;color:var(--soft);border:0;border-bottom:1px dotted var(--soft);font:inherit;font-size:.9rem;font-style:italic;margin-right:1.2rem}.mvs option{background:var(--paper2);color:var(--ink);font-style:normal}
.row{display:flex;align-items:center}.row a.link{flex:1;min-width:0}.row .sb{flex:1;width:auto;min-width:0}
.x{display:none;background:none;border:0;color:var(--soft);font-size:1.15rem;line-height:1;padding:0 .35rem;font-family:inherit}.editing .x{display:block}.x:hover{color:var(--red)}.crumb{margin:0 0 .35rem;font-size:.9rem;font-style:italic;color:var(--soft)}.sp0{display:inline-block;width:.9rem;flex:none}.tg2{background:none;border:0;color:var(--soft);font-size:.7rem;width:.9rem;padding:0;text-align:left;flex:none;transition:transform .15s}.tg2.op{transform:rotate(90deg)}.tg2:hover{color:var(--red)}.x svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.brand{position:relative;isolation:isolate}
.brand .lg{position:absolute;left:-8%;top:-25%;width:36%;height:150%;background:radial-gradient(closest-side,rgba(255,40,30,.6),rgba(255,20,20,.25) 55%,transparent 80%);filter:blur(10px);opacity:0;z-index:-1;pointer-events:none}
.brand .em{position:absolute;width:3.75px;height:3.75px;border-radius:50%;box-shadow:0 0 8px 2px #ff6a1a,0 0 2px #fff0c8;opacity:0;pointer-events:none}
.brand .lg{transition:opacity .5s ease}
.brand img{filter:drop-shadow(0 0 0 rgba(255,40,30,0)) drop-shadow(0 0 0 rgba(255,20,20,0));transition:filter .5s ease}
.brand.pl .lg{animation:lgp 4s ease-in-out}
.brand.pl img{animation:lgi 4s ease-in-out}
.brand.pl .em{animation:lge 2.6s ease-out}
@keyframes lgp{0%{opacity:0}40%{opacity:.9}100%{opacity:0}}
@keyframes lgi{0%{filter:drop-shadow(0 0 0 rgba(255,40,30,0))}40%{filter:drop-shadow(0 0 6px rgba(255,40,30,.8)) drop-shadow(0 0 14px rgba(255,20,20,.5))}100%{filter:drop-shadow(0 0 0 rgba(255,40,30,0))}}
@keyframes lge{0%{opacity:0;transform:translate(0,6px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0),-42px) scale(.4)}}
@media(prefers-reduced-motion:reduce){.brand.pl .lg,.brand.pl img,.brand.pl .em}
#lp{position:fixed;width:18rem;max-width:92vw;background:var(--paper2);padding:.7rem .8rem;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.55);z-index:10000}#lp[hidden]{display:none}#lp input{margin:0}
#ll{max-height:14rem;overflow:auto;margin-top:.4rem}#ll button{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;font-size:.95rem;color:var(--ink);padding:.2rem .3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#ll button.on,#ll button:hover{color:var(--red);background:rgba(255,255,255,.05)}#ll small{color:var(--soft);font-style:italic;margin-left:.5rem;font-size:.85em}
#bo{font-size:.85em;line-height:1.58}.bd:empty{display:none}#bo.ed-on .bd:empty{display:block;min-height:1.6em}.nv{margin-top:-.2rem}

<script>window.SNAP={"pages": {"cage": {"b": "<p class=\"first\">Raised in the reign of the first <a href=\"#queen\">Gilded Queen<\/a>, the tower climbs nine storeys above the rooftops of <a href=\"#aurelmont\">Aurelmont<\/a>. Its outer walls are plated in beaten gold, which the people believe to be the reason it has never been taken.<\/p><h2>The Halls<\/h2><p>The lowest hall is the Court of Petitions, where the common folk wait for judgement. Above it lie the Chamber of Seals, the Hall of Mirrors, and the Quiet Rooms, where the household sleeps. The upper storeys are closed to all but the ruling family.<\/p><h2>The Gate<\/h2><p>The great gate swings only inward. Its keeper is the <a href=\"#wardens\">Wardens of the Gate<\/a>, who log every arrival in a ledger and are sworn to say nothing of its contents.<\/p><h2>See also<\/h2><ul><li><a href=\"#lore\">Customs and Lore<\/a><\/li><li><a href=\"#chronicle\">The Chronicle<\/a><\/li><\/ul>", "s": "The tower, its halls, and its gate.", "t": "The Gilded Cage"}, "home": {"b": "<p>You’re warmly invited to read up on our adventures so far, contribute to your own entry, or add any tidbits of knowledge using the password-protected edit feature. Feel free to upload any artwork, whether original creations or gathered from sources, to serve as visual records of the places we’ve explored, the people we've met and the events we’ve witnessed across the moon of Kenneth.<\/p>", "cap": "", "par": "", "s": "You’ve stumbled upon a database of C.M.I.’s adventures in the Gilded Cage, and beyond.", "t": "Well-met, wanderer."}, "organisations1": {"b": "<p>Placeholder text.<\/p><h2>Placeholder heading<\/h2><p>Placeholder text.<\/p>", "s": "Placeholder summary.", "t": "Charitable Mercanaries Initiative"}, "people-mupkehn3": {"b": "<p>Placeholder text.<\/p><h2>Placeholder heading<\/h2><p>Placeholder text.<\/p>", "cap": "", "custom": true, "g": "People", "info": {"affiliations": "C.M.I.", "age": "Early 50's", "aliases": "", "birthplace": "Gilded Cage", "occupation": "Private Investigator", "residence": "Roseglow District, Gilded Cage", "species": "Human"}, "n": 1790861002959, "par": "", "s": "", "t": "Gil O'Darby"}, "people-mupndjc0": {"b": "<p>Placeholder text.<\/p><h2>Placeholder heading<\/h2><p>Placeholder text.<\/p>", "custom": true, "g": "People", "n": 1790865997344, "par": "people-mupkehn3", "s": "Placeholder summary.", "t": "Bobo the Monkey"}, "places-muplvmkb": {"b": "<p>The headquarters of the Charitable Mercenaries Initiative (C.M.I.) occupies the renovated remains of Maximilian Thread’s Sartorial Boutique, which was seized from its former owner.<br>The ground floor features C.M.I.’s primary meeting rooms and weapons storage, opening into a rear courtyard used for training and storing of carriages. The second floor serves as barracks for C.M.I. recruits, while the top floor houses Gil O'Darby’s private apartment - formerly the office of his private investigatior business.<\/p>", "cap": "C.M.I. Headquarters exterior.", "custom": true, "g": "Places", "n": 1790863482107, "par": "places1", "s": "", "t": "C.M.I. Headquarters"}, "places1": {"b": "<p>A sprawling port city of varied districts, sheltered inside a giant latticed metal cage. The Gilded Cage is located South-East of Vermillion Springs, seperated by a volcanic mountain range.<br>It is best known to us as <a href=\"#places-muplvmkb\">the base of operations<\/a> and residence of the <i>Charitable Mercenaries Initiative<\/i>, the headquarters of which lie in the <i>Roseglow District<\/i>.<\/p>", "cap": "A sketch of Cage as seen from afar, depicting the eight towers that line the city's border.", "g": "Places", "par": "", "s": "A coastal city comprising many distinct districts, housed within a towering metallic cage.", "t": "The Gilded Cage"}}, "cats": {"People": {"c": "#e5233a", "n": "People", "ov": 1, "t": 1790866683096}, "Places": {"c": "#4aa84a", "n": "Places", "ov": 1, "t": 1790862556942}, "cmupnafph": {"c": "#e89a2a", "n": "Items of Interes
